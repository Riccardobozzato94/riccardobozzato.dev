[build]
  command = "npm run build"
  # publish rimosso: il Netlify Next.js Runtime Plugin gestisce automaticamente l'output

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: le security header NON stanno qui.
#
# Il blocco [[headers]] è stato rimosso perché, con il Netlify Next.js Runtime,
# NON viene applicato in produzione: l'header CSP servito era quello di
# next.config.ts (senza googletagmanager → GA bloccato) e lo Strict-Transport-
# Security live era max-age=31536000 (default Netlify), non i 63072000 dichiarati
# qui. Verificato il 2026-10-02 su riccardobozzato.com.
#
# next.config.ts -> headers() è l'unica fonte che vale. Se cambi la CSP, cambia
# LÌ. Non duplicare qui.
#
# Anche /_next/static/* è gestito da next.config.ts (max-age=31536000,
# immutable) — non serve una seconda regola.

# Decap CMS redirect — catch both /admin and /admin/ (with subpaths)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
